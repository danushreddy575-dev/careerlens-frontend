      .brand { font: 900 38px Arial, sans-serif; fill: #172026; letter-spacing: 0; }
      .tag { font: 700 13px Arial, sans-serif; fill: #64748b; }
      .suit { fill: #172026; }
      .shirt { fill: #ffffff; }
      .tie { fill: #0f766e; }
      .skin { fill: #f2c7a7; }
      .hair { fill: #2a1c14; }
